name: refresh stats

on:
  schedule:
    - cron: "0 */4 * * *"       # runs every 4 hours automatically
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "stats.svg"
      - "streak.svg"
      - "langs.svg"
      - "year.svg"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
